spring.application.name=d288-backend

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/full-stack-ecommerce?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=ecommerceapp
spring.datasource.password=ecommerceapp
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#REPLACED THE ABOVE THIS COMMENT WITH THE ONE BELOW THIS COMMENT
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.jpa.hibernate.ddl-auto=none
#Change spring.jpa.hibernate.ddl-auto=none to = update so Hibernate will create tables to match JPA entities
#spring.jpa.hibernate.ddl-auto=update

# Added Jackson Mapper for case-sensitive errors I was getting ('purchase" "PURCHASED")
spring.jackson.mapper.accept-case-insensitive-enums=true

spring.data.rest.base-path=/api

# allow jackson parser to process comments in payload
spring.jackson.parser.allow-comments=true
# application logging level
logging.level.org.springframework=INFO

# USE WHILE DEBUGGING
server.error.include-message=always
server.error.include-binding-errors=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE