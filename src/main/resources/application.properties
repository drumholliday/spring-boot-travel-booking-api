#spring.application.name=demo
spring.application.name=d288-backend
spring.datasource.url=jdbc:mysql://localhost:3306/d288appdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=d288user
spring.datasource.password=d288pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
